name: Test create comment with body-path and reactions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create comment body file
        run: |
          echo "Test comment from body-path in act harness" > /tmp/comment-body.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          issue-number: '1'
          body-path: '/tmp/comment-body.txt'
          reactions: '+1,rocket'
          reactions-edit-mode: 'replace'
      - name: Assert action ran (create with body-path or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
