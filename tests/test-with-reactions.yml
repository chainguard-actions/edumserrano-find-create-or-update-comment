name: Test comment with reactions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to find/create comment with reactions on sentinel repo
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          issue-number: "1"
          body-includes: "test-marker-reactions"
          body: "Comment with reactions from find-create-or-update-comment action."
          edit-mode: replace
          reactions: "+1, hooray, rocket"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with reactions input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
