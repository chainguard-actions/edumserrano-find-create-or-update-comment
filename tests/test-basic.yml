name: Test find-create-or-update-comment basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run find-create-or-update-comment action
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: "1"
          comment-author: "github-actions[bot]"
          body-includes: "test comment"
          body: "This is a test comment"
          edit-mode: "replace"

      - name: Assert action ran (API call may fail in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail in act due to no real GitHub API access.
          # We verify it was attempted (outcome is either success or failure, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action step ran (outcome=${{ steps.action.outcome }})"
