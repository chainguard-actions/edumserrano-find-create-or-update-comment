name: Test basic usage - find create or update comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify action inputs are accepted
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: "1"
          body-includes: "test comment marker"
          comment-author: ""
          body: "This is a test comment body."
          edit-mode: "replace"
          reactions: ""
      - name: Assert action ran (API failure is acceptable in act environment)
        run: |
          echo "Action completed (with or without API error - expected in act)"
          echo "PASS"
